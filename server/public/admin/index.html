<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetPhare — Admin Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; }
    #map { flex: 1; height: 100vh; }
    #panel { width: 420px; background: #161b22; border-left: 1px solid #30363d; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    h2 { color: #ff7b72; font-size: 18px; margin-bottom: 8px; }
    h3 { color: #79c0ff; font-size: 14px; margin-bottom: 6px; }
    .card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; }
    .card label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; }
    .card input, .card textarea, .card select { width: 100%; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 8px; color: #c9d1d9; font-size: 13px; margin-bottom: 8px; }
    .card button { background: #238636; color: white; border: none; border-radius: 4px; padding: 10px 16px; cursor: pointer; font-size: 13px; width: 100%; }
    .card button:hover { background: #2ea043; }
    .card button.danger { background: #da3633; }
    .card button.danger:hover { background: #f85149; }
    #qr-container { text-align: center; margin-top: 12px; }
    #qr-container img { max-width: 200px; border: 2px solid #30363d; border-radius: 6px; }
    #status { font-size: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px; }
    #status .ok { color: #3fb950; }
    #status .ko { color: #f85149; }
    #alerts-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
    #alerts-list .alert-item { padding: 6px 0; border-bottom: 1px solid #21262d; }
    .alert-item button { background: #da3633; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 11px; }
    .waypoint-row { display: flex; gap: 8px; margin-bottom: 4px; align-items: center; }
    .waypoint-row input { flex: 1; margin-bottom: 0; }
    .waypoint-row button { width: auto; padding: 4px 8px; background: #da3633; }
    /* Login overlay */
    #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #login-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 32px; width: 360px; text-align: center; }
    #login-box h2 { margin-bottom: 20px; }
    #login-box input { width: 100%; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 10px; color: #c9d1d9; font-size: 14px; margin-bottom: 12px; }
    #login-box button { background: #238636; color: white; border: none; border-radius: 4px; padding: 10px 16px; cursor: pointer; font-size: 14px; width: 100%; }
    #login-error { color: #f85149; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h2>🛡 StreetPhare Admin</h2>
    <div id="status">
      <span id="sync-status">⏳ Connexion...</span> |
      Alertes actives: <span id="active-count">0</span> |
      Utilisateurs mesh: <span id="mesh-count">0</span>
    </div>

    <div class="card">
      <h3>📋 Signalements actifs</h3>
      <div id="alerts-list">Aucun signalement</div>
    </div>

    <div class="card">
      <h3>🎪 Créer une manifestation</h3>
      <label>Code (ex: FLEURUS-TOUR)</label>
      <input id="event-code" placeholder="MANIF-123">
      <label>Titre</label>
      <input id="event-title" placeholder="Le Tour de Fleurus">
      <label>Début (ISO)</label>
      <input id="event-start" type="datetime-local" title="Start time" placeholder="0.0000">
      <label>Fin (ISO)</label>
      <input id="event-end" type="datetime-local" title="End time" placeholder="60.00000">
      <label>Destination Lat</label>
      <input id="event-dest-lat" type="number" step="0.0001" placeholder="50.4762">
      <label>Destination Lng</label>
      <input id="event-dest-lng" type="number" step="0.0001" placeholder="4.5422">
      <label>Route GeoJSON</label>
      <textarea id="event-route" rows="2" placeholder='[[4.5422,50.4762],[4.5440,50.4780]]'></textarea>
      <label>Waypoints (lat, lng, label, h+min)</label>
      <div id="waypoints-container">
        <div class="waypoint-row">
          <input class="wp-label" placeholder="Label">
          <input class="wp-lat" type="number" step="0.0001" placeholder="Lat">
          <input class="wp-lng" type="number" step="0.0001" placeholder="Lng">
          <input class="wp-min" type="number" placeholder="Min">
        </div>
      </div>
      <button onclick="addWaypoint()">+ Ajouter waypoint</button>
      <button onclick="createEvent()" style="margin-top:8px;">Créer + Générer QR Code</button>
      <div id="qr-container"></div>
    </div>
  </div>

  <!-- Login overlay -->
  <div id="login-overlay">
    <div id="login-box">
      <h2>🔐 Connexion Admin</h2>
      <input id="login-user" type="text" placeholder="Nom d'utilisateur" value="admin" autocomplete="username">
      <div style="display:none"><input type="password" autocomplete="current-password" value="block-browser-autofill"></div>
      <input id="login-pass" type="password" placeholder="Mot de passe" autocomplete="off">
      <button onclick="doLogin()">Se connecter</button>
      <div id="login-error"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([50.4762, 4.5422], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    const markers = {};

    let ws;
    let currentHash = '';
    let adminToken = '';

    // Charger le token depuis sessionStorage si disponible.
    adminToken = sessionStorage.getItem('sp_admin_token') || '';

    async function doLogin() {
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.querySelector('#login-box button');
      const overlay = document.getElementById('login-overlay');

      btn.disabled = true;
      btn.textContent = 'Connexion...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();

        if (data.success && data.token) {
          adminToken = data.token;
          sessionStorage.setItem('sp_admin_token', data.token);

          // Recharger la page pour que le nouveau token soit utilisé
          // par le code d'initialisation (ligne ~156). Cela vide aussi
          // tout vieux token expiré qui pourrait être en mémoire.
          window.location.reload();
        } else {
          errorDiv.textContent = data.error || 'Identifiants invalides';
          btn.disabled = false;
          btn.textContent = 'Se connecter';
        }
      } catch (e) {
        errorDiv.textContent = 'Erreur réseau.';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    }

    // Si un token existe, on cache l'overlay et on tente la connexion WebSocket.
    // Le `ws.onerror` réaffichera l'overlay si le token est véritablement invalide.
    if (adminToken) {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('sync-status').innerHTML = '<span class="ok">● Connexion...</span>';
      try { connect(); } catch (_) { /* ignore */ }
    }

    // Permettre la connexion via Entrée
    document.getElementById('login-pass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    function connect() {
      if (!adminToken) {
        document.getElementById('sync-status').innerHTML = '<span class="ko">● Token manquant</span>';
        return;
      }

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/admin-ws?token=${encodeURIComponent(adminToken)}`;
      ws = new WebSocket(wsUrl);

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'admin_snapshot') {
          updateAlerts(data.alerts || []);
          updateStatus(data.syncState);
        }
        if (data.type === 'new_alert') updateAlerts([data.alert]);
      };
      ws.onopen = () => document.getElementById('sync-status').innerHTML = '<span class="ok">● Connecté</span>';
      ws.onclose = () => {
        document.getElementById('sync-status').innerHTML = '<span class="ko">● Déconnecté — reconnexion dans 3s</span>';
        setTimeout(connect, 3000);
      };
      ws.onerror = () => {
        // Si le WebSocket échoue avec un code 400/401, le token est invalide.
        // On efface le token et on ré-affiche l'overlay.
        sessionStorage.removeItem('sp_admin_token');
        adminToken = '';
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('sync-status').innerHTML = '<span class="ko">● Session expirée — reconnectez-vous</span>';
      };
    }

    function updateAlerts(alerts) {
      const list = document.getElementById('alerts-list');
      document.getElementById('active-count').textContent = alerts.length;
      if (!alerts.length) { list.innerHTML = 'Aucun signalement'; return; }
      list.innerHTML = alerts.map(a => `<div class="alert-item">
        <strong>${a.type}</strong> (${(a.votes||[]).length} votes) — ${a.description || 'Sans description'}<br>
        <small>${a.lat.toFixed(4)}, ${a.lng.toFixed(4)}</small>
        <button onclick="rejectAlert('${a.id}')">❌ Révoquer</button>
      </div>`).join('');

      alerts.forEach(a => {
        const key = a.id;
        if (markers[key]) { markers[key].setLatLng([a.lat, a.lng]); return; }
        markers[key] = L.marker([a.lat, a.lng]).addTo(map)
          .bindPopup(`<b>${a.type}</b><br>${a.description || ''}<br><small>${a.id}</small>`);
      });
    }

    function updateStatus(syncState) {
      document.getElementById('sync-status').innerHTML = '<span class="ok">● Connecté</span>';
      if (syncState) {
        document.getElementById('mesh-count').textContent = syncState.meshClients || 0;
      }
    }

    async function rejectAlert(id) {
      if (!adminToken) { alert('Token admin manquant'); return; }
      const res = await fetch(`/api/alerts/${id}/reject`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${adminToken}`
        }
      });
      if (res.ok) {
        delete markers[id];
        if (ws && ws.readyState === WebSocket.OPEN) connect(); // refresh via snapshot
      } else {
        const err = await res.json();
        alert(err.error || 'Erreur lors de la révocation');
      }
    }

    function addWaypoint() {
      const div = document.createElement('div');
      div.className = 'waypoint-row';
      div.innerHTML = '<input class="wp-label" placeholder="Label"><input class="wp-lat" type="number" step="0.0001" placeholder="Lat"><input class="wp-lng" type="number" step="0.0001" placeholder="Lng"><input class="wp-min" type="number" placeholder="Min"><button onclick="this.parentElement.remove()">✕</button>';
      document.getElementById('waypoints-container').appendChild(div);
    }

    async function createEvent() {
      if (!adminToken) { alert('Token admin manquant'); return; }

      const code = document.getElementById('event-code').value;
      const title = document.getElementById('event-title').value;
      const startAt = document.getElementById('event-start').value;
      const endAt = document.getElementById('event-end').value;
      const destLat = parseFloat(document.getElementById('event-dest-lat').value);
      const destLng = parseFloat(document.getElementById('event-dest-lng').value);
      const route = document.getElementById('event-route').value;

      const wpRows = document.querySelectorAll('#waypoints-container .waypoint-row');
      const waypoints = Array.from(wpRows).map(r => ({
        label: r.querySelector('.wp-label').value,
        latitude: parseFloat(r.querySelector('.wp-lat').value),
        longitude: parseFloat(r.querySelector('.wp-lng').value),
        scheduledAt: new Date(new Date(startAt).getTime() + parseInt(r.querySelector('.wp-min').value || '0') * 60000).toISOString(),
      }));

      const body = {
        code, title, startAt, endAt: endAt || null, visibleAt: startAt,
        routeGeoJson: route, waypoints, pois: [], careCenters: [], exitPoints: [], safeZones: [],
        destinationLatitude: destLat, destinationLongitude: destLng
      };

      const res = await fetch('/api/events/create', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${adminToken}`
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('qr-container').innerHTML = `<p><b>Code:</b> ${data.code}</p><p>QR Code (scannez avec StreetPhare) :</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(JSON.stringify(data))}" alt="QR Code">`;
      } else {
        alert(data.error || 'Erreur création événement');
      }
    }
  </script>
</body>
</html>
