android.useAndroidX=true

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# AGP 9.x : lint (analyse UAST Kotlin) et R8 tournent dans le daemon Gradle et
# chargent énormément de classes — 512m de metaspace est insuffisant (OOM Metaspace).
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m
# Contourne le bug Kotlin "this and base files have different roots" qui survient
# à la fermeture des caches incrémentaux lorsque le Pub Cache Flutter (C:)
# et le projet (E:) sont sur des lecteurs différents (Windows).
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
