android.useAndroidX=true

# Built-in Kotlin migration blocked by third-party plugins (connectivity_plus, etc.)
# that still apply 'kotlin-android' manually. Until these plugins migrate to AGP 9+,
# we must use: android.builtInKotlin=false + KGP pinned in settings.gradle.kts
# Ref: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
