android.useAndroidX=true

# Built-in Kotlin DÉSACTIVÉ (mode compatibilité KGP).
# La migration est bloquée en amont car AGP 9.1.0 embarque le compilateur
# Kotlin 2.2.x alors que :
#   1. Flutter 3.47 exige Kotlin >= 2.2.20 (bug flutter#192206 non backporté
#      en stable -> erreur "Your project's Kotlin version (2.2.10)").
#   2. Les plugins récents (reactive_ble_mobile, etc.) tirent kotlin-stdlib
#      2.4.x (metadata 2.4.0), illisible par le compilateur 2.2 d'AGP.
# => On conserve KGP 2.4.0 + android.builtInKotlin=false.
# Ref: https://github.com/flutter/flutter/issues/192167
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Contourne le bug Kotlin "this and base files have different roots" qui survient
# à la fermeture des caches incrémentaux lorsque le Pub Cache Flutter (C:)
# et le projet (E:) sont sur des lecteurs différents (Windows).
kotlin.incremental=false
