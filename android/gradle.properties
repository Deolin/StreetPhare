android.useAndroidX=true

# Built-in Kotlin migration blocked by third-party plugins (connectivity_plus, etc.)
# that still apply 'kotlin-android' manually. Until these plugins migrate to AGP 9+,
# we must use: android.builtInKotlin=false + KGP pinned in settings.gradle.kts
# Ref: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Contourne le bug Kotlin "this and base files have different roots" qui survient
# à la fermeture des caches incrémentaux lorsque le Pub Cache Flutter (C:)
# et le projet (E:) sont sur des lecteurs différents (Windows).
kotlin.incremental=false
