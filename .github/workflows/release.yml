name: StreetPhare — Release (exécutables)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex: 2.3.0). Ignoré si déclenché par un tag.'
        required: false
        default: '0.0.0'

permissions:
  contents: write

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # Windows (EXE)
  # ═════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows (EXE)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package (zip)
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "StreetPhare-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: StreetPhare-windows-x64.zip
          retention-days: 14

  # ═════════════════════════════════════════════════════════════════════════════
  # Linux (tar.gz)
  # ═════════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # ninja-build + libgtk-3-dev : toolchain Flutter Linux.
          # libsecret-1-dev : requis par flutter_secure_storage (libsecret-1>=0.18.4).
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package (tar.gz)
        run: tar -czf StreetPhare-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: StreetPhare-linux-x64.tar.gz
          retention-days: 14

  # ═════════════════════════════════════════════════════════════════════════════
  # Android (APK + AAB)
  # ═════════════════════════════════════════════════════════════════════════════
  build-android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Patch reactive_ble_mobile compileSdk (33 -> 36)
        run: bash scripts/patch_reactive_blemobile.sh

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build AppBundle (release)
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ═════════════════════════════════════════════════════════════════════════════
  # Release GitHub
  # ═════════════════════════════════════════════════════════════════════════════
  release:
    name: Créer la release GitHub
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-android]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Résoudre la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER="${{ inputs.version }}"
            if [ -z "$VER" ]; then
              VER=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            fi
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version de release: $TAG"

      - name: Télécharger les artefacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Aplatir les artefacts
        run: |
          mkdir -p release-assets
          find dist -type f -exec mv {} release-assets/ \;
          echo "Assets à publier :"
          ls -la release-assets

      - name: Créer la release et uploader les exécutables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG déjà existante → upload des assets."
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "StreetPhare $TAG" \
              --generate-notes \
              release-assets/*
          fi
