# analysis_options.yaml — StreetPhare
#
# Règles d'analyse statique strictes activées le 29/06/2026 (P2.1).
# Voir: docs/plan_et_audit_complet_28062026.md#P2.1

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # ── Règles strictes (P2.1) ──────────────────────────────────
    # Futures non attendus = erreur (catch les oublis de await).
    unawaited_futures: error

    # Interdire les print() hors debug (utiliser debugPrint ou ClientDebugLogger).
    avoid_print: true

    # Guillemets simples (cohérence style projet).
    prefer_single_quotes: true

    # Interdire les const inutiles (détection automatique).
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true

    # Fermeture des streams (éviter les fuites mémoire).
    close_sinks: true

    # Annotations de type explicites sur les API publiques.
    always_declare_return_types: true
    annotate_overrides: true

    # Collections immuables (préférer const à final).
    prefer_const_declarations: true

    # Éviter les lambdas vides (confusion).
    avoid_empty_else: true

    # Imports triés et propres.
    directives_ordering: true
    sort_constructors_first: true

    # Sécurité : pas d'URL http:// en dur (forcer https://).
    # NOTE: cette règle est informative, pas bloquante car les
    # fallbacks locaux (127.0.0.1) sont légitimes en debug.
    # secure_pubspec_urls: true  ← trop restrictif pour les mirrors